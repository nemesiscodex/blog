{{ range .Site.Params.customJS }}<script src="{{ . | relURL }}" defer></script>{{ end }}
{{ if .Page.Store.Get "hasMermaid" }}
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";
    mermaid.initialize({
      startOnLoad: true,
      theme: "dark",
      securityLevel: "strict",
      themeVariables: { edgeLabelBackground: "#181b1e" }
    });
  </script>
{{ end }}
